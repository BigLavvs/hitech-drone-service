<text x="44.0" y="2278.0" fill="#e2e8f0" font-size="12" font-weight="700">Error Flows:</text>
<text x="44.0" y="2300.0" fill="#94a3b8" font-size="9.5">- Invalid coordinates (out of bounds / malformed): 400</text>
<text x="44.0" y="2318.0" fill="#94a3b8" font-size="9.5">  INVALID_GEOMETRY</text>
<text x="44.0" y="2336.0" fill="#94a3b8" font-size="9.5">- User not assigned to survey's project: 403 Forbidden</text>
<text x="44.0" y="2354.0" fill="#94a3b8" font-size="9.5">- Survey Engineer or Viewer attempts delete: 403 Forbidden</text>
<text x="44.0" y="2372.0" fill="#94a3b8" font-size="9.5">- Delete on non-existent measurement_id: 404 Not Found</text>
<rect x="588.3" y="2254.0" width="534.3" height="174.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="602.3" y="2278.0" fill="#e2e8f0" font-size="12" font-weight="700">Authorization Model (Measurements):</text>
<text x="602.3" y="2300.0" fill="#94a3b8" font-size="9.5">- Create: Administrator, Project Manager, Survey Engineer,</text>
<text x="602.3" y="2318.0" fill="#94a3b8" font-size="9.5">  and Viewer may all create measurements; this is an</text>
<text x="602.3" y="2336.0" fill="#94a3b8" font-size="9.5">  analytical record and does not modify survey/project data</text>
<text x="602.3" y="2354.0" fill="#94a3b8" font-size="9.5">- Delete: Administrator and Project Manager only; Survey</text>
<text x="602.3" y="2372.0" fill="#94a3b8" font-size="9.5">  Engineer and Viewer cannot delete measurements</text>
<text x="602.3" y="2390.0" fill="#94a3b8" font-size="9.5">- Viewer remains read-only for underlying survey/project</text>
<text x="602.3" y="2408.0" fill="#94a3b8" font-size="9.5">  data; measurement creation is the one write exception</text>
<rect x="1146.7" y="2254.0" width="534.3" height="156.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="1160.7" y="2278.0" fill="#e2e8f0" font-size="12" font-weight="700">Module Interactions (Drone Mapping Service):</text>
<text x="1160.7" y="2300.0" fill="#94a3b8" font-size="9.5">- The client submits raw coordinates only; Maps Module</text>
<text x="1160.7" y="2318.0" fill="#94a3b8" font-size="9.5">  computes the distance/area value, client never sends it</text>
<text x="1160.7" y="2336.0" fill="#94a3b8" font-size="9.5">- Calculated value and unit are persisted alongside the</text>
<text x="1160.7" y="2354.0" fill="#94a3b8" font-size="9.5">  raw coordinates for replayability</text>
<text x="1160.7" y="2372.0" fill="#94a3b8" font-size="9.5">- Audit Module is called synchronously on create and</text>
<text x="1160.7" y="2390.0" fill="#94a3b8" font-size="9.5">  delete so no measurement action is left unlogged</text>
</svg>