<text x="1137.7" y="1069.0" text-anchor="middle" fill="#5eead4" font-size="9.5">200 {user_id, email, role}</text>
<line x1="812.2" y1="1134.0" x2="353.9" y2="1134.0" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
<rect x="504.9" y="1110.0" width="156.3" height="18" rx="4" fill="#0f172a"/>
<text x="583.0" y="1123.0" text-anchor="middle" fill="#5eead4" font-size="9.5">200 {user_id, email, role}</text>
<rect x="30.0" y="1254.0" width="557.3" height="156.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="44.0" y="1278.0" fill="#e2e8f0" font-size="12" font-weight="700">Error Flows:</text>
<text x="44.0" y="1300.0" fill="#94a3b8" font-size="9.5">- Missing or malformed cookie: 401 Unauthorized</text>
<text x="44.0" y="1318.0" fill="#94a3b8" font-size="9.5">- JWT signature invalid or expired: 401 Unauthorized</text>
<text x="44.0" y="1336.0" fill="#94a3b8" font-size="9.5">- Missing required claim (sub/email/role/exp): 401</text>
<text x="44.0" y="1354.0" fill="#94a3b8" font-size="9.5">  INVALID_TOKEN</text>
<text x="44.0" y="1372.0" fill="#94a3b8" font-size="9.5">- No matching active local user: 403 ACCOUNT_NOT_PROVISIONED</text>
<text x="44.0" y="1390.0" fill="#94a3b8" font-size="9.5">- Unsafe request without valid CSRF token: 403 CSRF_FAILURE</text>
<rect x="611.3" y="1254.0" width="557.3" height="210.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="625.3" y="1278.0" fill="#e2e8f0" font-size="12" font-weight="700">Module Interactions (Drone Mapping Service):</text>
<text x="625.3" y="1300.0" fill="#94a3b8" font-size="9.5">- Access Control Module never issues tokens; it only</text>
<text x="625.3" y="1318.0" fill="#94a3b8" font-size="9.5">  validates externally-issued RS256 JWTs</text>
<text x="625.3" y="1336.0" fill="#94a3b8" font-size="9.5">- No local /auth/login, credential check, or refresh</text>
<text x="625.3" y="1354.0" fill="#94a3b8" font-size="9.5">  token issuance exists in this service</text>
<text x="625.3" y="1372.0" fill="#94a3b8" font-size="9.5">- No periodic public-key / JWKS refresh is shown; key</text>
<text x="625.3" y="1390.0" fill="#94a3b8" font-size="9.5">  material is assumed available to the service</text>
<text x="625.3" y="1408.0" fill="#94a3b8" font-size="9.5">- Project-level access scoping is enforced by each target</text>
<text x="625.3" y="1426.0" fill="#94a3b8" font-size="9.5">  module (Projects, Surveys, Files, etc.), not globally</text>
<text x="625.3" y="1444.0" fill="#94a3b8" font-size="9.5">  by Access Control Module</text>
<rect x="1192.7" y="1254.0" width="557.3" height="174.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="1206.7" y="1278.0" fill="#e2e8f0" font-size="12" font-weight="700">Legend:</text>
<text x="1206.7" y="1300.0" fill="#94a3b8" font-size="9.5">- Solid arrow: request / call</text>
<text x="1206.7" y="1318.0" fill="#94a3b8" font-size="9.5">- Dashed arrow: response</text>
<text x="1206.7" y="1336.0" fill="#94a3b8" font-size="9.5">- Dashed orange box: Drone Mapping Service boundary</text>
<text x="1206.7" y="1354.0" fill="#94a3b8" font-size="9.5">- Colored modules inside the box are internal</text>
<text x="1206.7" y="1372.0" fill="#94a3b8" font-size="9.5">- Auth is via HttpOnly cookie, not an Authorization header</text>
<text x="1206.7" y="1390.0" fill="#94a3b8" font-size="9.5">- Unsafe (state-changing) requests additionally require</text>
<text x="1206.7" y="1408.0" fill="#94a3b8" font-size="9.5">  CSRF token validation</text>
</svg>