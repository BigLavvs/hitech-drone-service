<rect x="30.0" y="1754.0" width="481.7" height="102.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="44.0" y="1778.0" fill="#e2e8f0" font-size="12" font-weight="700">Error Flows:</text>
<text x="44.0" y="1800.0" fill="#94a3b8" font-size="9.5">- PM creates site on unassigned project: 403 Forbidden</text>
<text x="44.0" y="1818.0" fill="#94a3b8" font-size="9.5">- PM updates another PM's project: 403 Forbidden</text>
<text x="44.0" y="1836.0" fill="#94a3b8" font-size="9.5">- Invalid project_id in site URL: 404 Not Found</text>
<rect x="535.7" y="1754.0" width="481.7" height="174.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="549.7" y="1778.0" fill="#e2e8f0" font-size="12" font-weight="700">Module Interactions (Drone Mapping Service):</text>
<text x="549.7" y="1800.0" fill="#94a3b8" font-size="9.5">- Access Control Module validates JWT, extracts roles,</text>
<text x="549.7" y="1818.0" fill="#94a3b8" font-size="9.5">  and checks project ownership before any module runs</text>
<text x="549.7" y="1836.0" fill="#94a3b8" font-size="9.5">- Projects Module owns Project and Site entities and</text>
<text x="549.7" y="1854.0" fill="#94a3b8" font-size="9.5">  enforces business rules</text>
<text x="549.7" y="1872.0" fill="#94a3b8" font-size="9.5">- Audit Module performs append-only logging, called</text>
<text x="549.7" y="1890.0" fill="#94a3b8" font-size="9.5">  synchronously in the request path</text>
<text x="549.7" y="1908.0" fill="#94a3b8" font-size="9.5">- All modules communicate through service interfaces</text>
<rect x="1041.3" y="1754.0" width="481.7" height="120.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="1055.3" y="1778.0" fill="#e2e8f0" font-size="12" font-weight="700">Legend:</text>
<text x="1055.3" y="1800.0" fill="#94a3b8" font-size="9.5">- Solid arrow: request / forward</text>
<text x="1055.3" y="1818.0" fill="#94a3b8" font-size="9.5">- Dashed arrow: response</text>
<text x="1055.3" y="1836.0" fill="#94a3b8" font-size="9.5">- Dashed orange box: Drone Mapping Service boundary</text>
<text x="1055.3" y="1854.0" fill="#94a3b8" font-size="9.5">- Colored modules inside the box are internal</text>
</svg>