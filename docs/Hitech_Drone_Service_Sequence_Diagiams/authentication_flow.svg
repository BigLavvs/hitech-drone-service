<line x1="70" y1="162.0" x2="1383" y2="162.0" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="698.2" y="149.0" width="56.5" height="22" rx="11" fill="#334155"/>
<text x="726.5" y="164.0" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="700">Login</text>
<line x1="333.4" y1="216.0" x2="433.4" y2="216.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="343.4" y="192.0" width="80.0" height="18" rx="4" fill="#0f172a"/>
<text x="383.4" y="205.0" text-anchor="middle" fill="#cbd5e1" font-size="9.5">POST /auth/login {credentials}</text>
<line x1="559.4" y1="270.0" x2="699.0" y2="270.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="569.4" y="246.0" width="119.6" height="18" rx="4" fill="#0f172a"/>
<text x="629.2" y="259.0" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Forward login request</text>
<path d="M762.0,324.0 C808.0,324.0 808.0,354.0 762.0,354.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="804.0" y="326.0" width="177.6" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
<text x="892.8" y="340.0" text-anchor="middle" fill="#94a3b8" font-size="9.5">Validate credentials, sign JWT</text>
<line x1="699.0" y1="392.0" x2="559.4" y2="392.0" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
<rect x="569.4" y="368.0" width="119.6" height="18" rx="4" fill="#0f172a"/>
<text x="629.2" y="381.0" text-anchor="middle" fill="#5eead4" font-size="9.5">200 {access_token, refresh_token}</text>
<line x1="433.4" y1="446.0" x2="333.4" y2="446.0" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
<rect x="343.4" y="422.0" width="80.0" height="18" rx="4" fill="#0f172a"/>
<text x="383.4" y="435.0" text-anchor="middle" fill="#5eead4" font-size="9.5">200 {access_token, refresh_token}</text>
<line x1="70" y1="486.0" x2="1383" y2="486.0" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
<rect x="620.1" y="473.0" width="212.8" height="22" rx="11" fill="#334155"/>
<text x="726.5" y="488.0" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="700">Authenticated Request Example</text>
<line x1="333.4" y1="540.0" x2="433.4" y2="540.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="343.4" y="516.0" width="80.0" height="18" rx="4" fill="#0f172a"/>
<text x="383.4" y="529.0" text-anchor="middle" fill="#cbd5e1" font-size="9.5">GET /projects Bearer {jwt}</text>
<line x1="559.4" y1="594.0" x2="925.0" y2="594.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="672.0" y="570.0" width="140.4" height="18" rx="4" fill="#0f172a"/>
<text x="742.2" y="583.0" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Forward request + token</text>
<path d="M1011.6,648.0 C1057.6,648.0 1057.6,678.0 1011.6,678.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1053.6" y="650.0" width="236.1" height="20" rx="5" fill="#1e293b" stroke="#334155"/>
<text x="1171.7" y="664.0" text-anchor="middle" fill="#94a3b8" font-size="9.5">Verify signature (cached Auth public key)</text>
<line x1="1098.2" y1="716.0" x2="1235.4" y2="716.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1108.2" y="692.0" width="117.2" height="18" rx="4" fill="#0f172a"/>
<text x="1166.8" y="705.0" text-anchor="middle" fill="#cbd5e1" font-size="9.5">Query project assignments for user_id</text>
<line x1="1235.4" y1="770.0" x2="1098.2" y2="770.0" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
<rect x="1115.3" y="746.0" width="103.1" height="18" rx="4" fill="#0f172a"/>
<text x="1166.8" y="759.0" text-anchor="middle" fill="#5eead4" font-size="9.5">assignments list</text>
<line x1="925.0" y1="824.0" x2="559.4" y2="824.0" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
<rect x="637.4" y="800.0" width="209.5" height="18" rx="4" fill="#0f172a"/>
<text x="742.2" y="813.0" text-anchor="middle" fill="#5eead4" font-size="9.5">context {user_id, role, project_ids}</text>
<line x1="433.4" y1="878.0" x2="333.4" y2="878.0" stroke="#5eead4" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
<rect x="343.4" y="854.0" width="80.0" height="18" rx="4" fill="#0f172a"/>
<text x="383.4" y="867.0" text-anchor="middle" fill="#5eead4" font-size="9.5">Request proceeds to target module</text>
<rect x="30.0" y="998.0" width="448.3" height="102.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="44.0" y="1022.0" fill="#e2e8f0" font-size="12" font-weight="700">Error Flows:</text>
<text x="44.0" y="1044.0" fill="#94a3b8" font-size="9.5">- Invalid credentials: Auth Service returns 401</text>
<text x="44.0" y="1062.0" fill="#94a3b8" font-size="9.5">- Expired JWT: Access Control Module returns 401</text>
<text x="44.0" y="1080.0" fill="#94a3b8" font-size="9.5">- No assignments: returns 200 with empty list</text>
<rect x="502.3" y="998.0" width="448.3" height="138.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="516.3" y="1022.0" fill="#e2e8f0" font-size="12" font-weight="700">Module Interactions (Drone Mapping Service):</text>
<text x="516.3" y="1044.0" fill="#94a3b8" font-size="9.5">- Access Control Module is the only module involved in</text>
<text x="516.3" y="1062.0" fill="#94a3b8" font-size="9.5">  this flow; it never issues tokens, only validates them</text>
<text x="516.3" y="1080.0" fill="#94a3b8" font-size="9.5">- JWT signature verified locally using a cached Auth</text>
<text x="516.3" y="1098.0" fill="#94a3b8" font-size="9.5">  Service public key, refreshed on a set interval</text>
<text x="516.3" y="1116.0" fill="#94a3b8" font-size="9.5">- Project assignment lookup hits PostgreSQL directly</text>
<rect x="974.7" y="998.0" width="448.3" height="120.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="988.7" y="1022.0" fill="#e2e8f0" font-size="12" font-weight="700">Legend:</text>
<text x="988.7" y="1044.0" fill="#94a3b8" font-size="9.5">- Solid arrow: request / forward</text>
<text x="988.7" y="1062.0" fill="#94a3b8" font-size="9.5">- Dashed arrow: response</text>
<text x="988.7" y="1080.0" fill="#94a3b8" font-size="9.5">- Dashed orange box: Drone Mapping Service boundary</text>
<text x="988.7" y="1098.0" fill="#94a3b8" font-size="9.5">- Colored modules inside the box are internal</text>
</svg>