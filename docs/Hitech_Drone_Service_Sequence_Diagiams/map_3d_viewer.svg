<text x="1223.5" y="1839.0" text-anchor="middle" fill="#5eead4" font-size="9.5">200 GLB bytes (rendered by Three.js/CesiumJS)</text>
<rect x="30.0" y="1970.0" width="766.0" height="156.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="44.0" y="1994.0" fill="#e2e8f0" font-size="12" font-weight="700">Error Flows:</text>
<text x="44.0" y="2016.0" fill="#94a3b8" font-size="9.5">- User not assigned to survey's project: 403 Forbidden</text>
<text x="44.0" y="2034.0" fill="#94a3b8" font-size="9.5">- File not yet processed (status != ready):</text>
<text x="44.0" y="2052.0" fill="#94a3b8" font-size="9.5">  409 FILE_NOT_READY</text>
<text x="44.0" y="2070.0" fill="#94a3b8" font-size="9.5">- Signed URL expired mid-session: client re-requests</text>
<text x="44.0" y="2088.0" fill="#94a3b8" font-size="9.5">  viewer-config for a fresh signed URL</text>
<text x="44.0" y="2106.0" fill="#94a3b8" font-size="9.5">- Unsupported or corrupt 3D format: 422 UNSUPPORTED_FORMAT</text>
<rect x="820.0" y="1970.0" width="766.0" height="228.0" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="834.0" y="1994.0" fill="#e2e8f0" font-size="12" font-weight="700">Module Interactions (Drone Mapping Service):</text>
<text x="834.0" y="2016.0" fill="#94a3b8" font-size="9.5">- Maps and Models3D Modules never proxy file bytes; they</text>
<text x="834.0" y="2034.0" fill="#94a3b8" font-size="9.5">  issue short-lived signed URLs so the browser talks to</text>
<text x="834.0" y="2052.0" fill="#94a3b8" font-size="9.5">  Object Storage / CDN directly</text>
<text x="834.0" y="2070.0" fill="#94a3b8" font-size="9.5">- Files Module is the single source of truth for file</text>
<text x="834.0" y="2088.0" fill="#94a3b8" font-size="9.5">  status and storage paths for both viewers</text>
<text x="834.0" y="2106.0" fill="#94a3b8" font-size="9.5">- Viewer requests never touch Redis or the Processing</text>
<text x="834.0" y="2124.0" fill="#94a3b8" font-size="9.5">  Module; those are upload-time concerns only</text>
<text x="834.0" y="2142.0" fill="#94a3b8" font-size="9.5">- Access Control Module scoping happens once per viewer-</text>
<text x="834.0" y="2160.0" fill="#94a3b8" font-size="9.5">  config request, not per tile; tiles are authorized by</text>
<text x="834.0" y="2178.0" fill="#94a3b8" font-size="9.5">  the short-lived signed URL, not a JWT</text>
