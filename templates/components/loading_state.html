<section class="state-panel state-panel--loading" aria-live="polite" aria-busy="true">
  <span class="loading-indicator" aria-hidden="true"></span>
  <div>
    <h2>{{ loading_title|default:"Loading" }}</h2>
    <p>{{ loading_description|default:"Please wait while the latest information is retrieved." }}</p>
  </div>
</section>
